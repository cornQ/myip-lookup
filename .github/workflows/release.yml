name: Publish release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[publish-latest-release]')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$(git tag --sort=-version:refname | head -n 1)"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag: $tag" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build release archive
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          archive="myip-lookup-${RELEASE_TAG}.zip"
          git archive \
            --format=zip \
            --prefix="myip-lookup-${RELEASE_TAG}/" \
            --output="$archive" \
            "$RELEASE_TAG"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          archive="myip-lookup-${RELEASE_TAG}.zip"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$archive" --clobber
          else
            gh release create "$RELEASE_TAG" \
              "$archive#MyIP Lookup ${RELEASE_TAG} ZIP" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
